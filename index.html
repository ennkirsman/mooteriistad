<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Harjuta mõõteriistade skaaladelt lugemist: mõõtepiirkond, jaotise väärtus, mõõtmistäpsus ja näit.">
<title>Skaala lugemine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECEE; --panel:#F6F8F9; --face:#FFFFFF; --ink:#18232C; --muted:#53626C;
  --line:#C3CED4; --grid:rgba(29,94,122,.07); --grid2:rgba(29,94,122,.15);
  --needle:#D2232A; --accent:#1D5E7A; --accent-ink:#FFFFFF; --ok:#1E7A46; --bad:#B3261E;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11181D; --panel:#172128; --face:#1E2A32; --ink:#E6ECEF; --muted:#9AAAB4;
    --line:#34454F; --grid:rgba(111,179,210,.06); --grid2:rgba(111,179,210,.13);
    --needle:#FF5C5C; --accent:#6FB3D2; --accent-ink:#0E1A20; --ok:#5CC98A; --bad:#FF8A80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11181D; --panel:#172128; --face:#1E2A32; --ink:#E6ECEF; --muted:#9AAAB4;
  --line:#34454F; --grid:rgba(111,179,210,.06); --grid2:rgba(111,179,210,.13);
  --needle:#FF5C5C; --accent:#6FB3D2; --accent-ink:#0E1A20; --ok:#5CC98A; --bad:#FF8A80;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:17px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 48px}

header{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
h1{font-size:clamp(2rem,4.5vw,2.8rem);line-height:1.05;margin:0;letter-spacing:-.015em}
.sub{margin:.45em 0 0;color:var(--muted);max-width:54ch}
.score{color:var(--muted);font-size:.95rem;white-space:nowrap}
.score b{color:var(--ink);font-size:1.35rem}

.tabs{display:flex;gap:4px;background:var(--panel);padding:5px;border-radius:12px;border:1px solid var(--line);width:fit-content;max-width:100%;overflow-x:auto}
.tabs button{font:inherit;font-weight:700;border:0;background:transparent;cursor:pointer;padding:9px 16px;border-radius:8px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"],.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.levels{align-items:center}
.levels .lvl-lab{color:var(--muted);font-weight:700;padding:0 6px 0 8px;white-space:nowrap}
@media (max-width:480px){.tabs button{padding:8px 9px}.levels .lvl-lab{padding:0 2px 0 3px}}

.units{margin:14px 0 20px}
.units summary{cursor:pointer;color:var(--muted);font-weight:700;width:fit-content}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:inherit;font-weight:700;padding:5px 13px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;text-decoration:line-through}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--face);color:var(--ink);text-decoration:none}

.work{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:840px){.work{grid-template-columns:1fr}}

.bench{background-color:var(--panel);
  background-image:
    linear-gradient(var(--grid2) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid2) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:50px 50px,50px 50px,10px 10px,10px 10px;
  border:1px solid var(--line);border-radius:16px;padding:14px 16px 20px}
.bench h2{margin:0 0 6px;font-size:1.05rem;color:var(--muted)}
#stage{display:flex;justify-content:center}
#stage svg{display:block;-webkit-user-select:none;user-select:none}
svg.h{width:100%;height:auto}
svg.v{height:min(560px,62vh);width:auto;max-width:100%}
svg.d{width:min(100%,430px);height:auto}
svg.live{touch-action:none;cursor:grab}
svg.live:active{cursor:grabbing}

.s-body{fill:var(--face);stroke:var(--ink);stroke-width:2}
.s-glass{fill:var(--face);stroke:var(--ink);stroke-width:1.6}
.s-slot{fill:var(--bg);stroke:var(--ink);stroke-width:1.2}
.s-tick{stroke:var(--ink);stroke-width:1.1}
.s-tick.md{stroke-width:1.5}
.s-tick.mj{stroke-width:2.2}
.s-lbl{fill:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-weight:700;font-size:17px}
.s-unit{fill:var(--muted);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-weight:700;font-size:21px}
.s-ndl{fill:var(--needle);stroke:var(--needle)}
.s-liq{fill:var(--needle)}
.s-hub{fill:var(--ink)}
.s-rod{fill:none;stroke:var(--muted);stroke-width:3}
.s-spring{fill:none;stroke:var(--muted);stroke-width:2;stroke-linejoin:round}

.task{background:var(--face);border:1px solid var(--line);border-radius:16px;padding:20px}
.prompt{font-size:1.12rem;margin:0 0 16px}
.target{display:block;font-size:1.9rem;font-weight:700;margin-top:4px}
.row{margin-bottom:14px}
.row .lab{display:block;font-weight:700;margin-bottom:4px}
.inline{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
input{font:inherit;font-size:1.15rem;width:6.2em;padding:7px 10px;border:2px solid var(--line);border-radius:8px;background:var(--face);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
input.ok{border-color:var(--ok)}
input.bad{border-color:var(--bad)}
.u{color:var(--muted);font-weight:700}
.mark{font-weight:700;min-width:1.2em}
.mark.ok{color:var(--ok)}
.mark.bad{color:var(--bad)}
.opt{display:flex;align-items:center;gap:10px;width:fit-content;margin:0 0 16px;font-weight:700;cursor:pointer}
.opt input{width:1.25em;height:1.25em;padding:0;margin:0;accent-color:var(--accent);cursor:pointer}
.hint{color:var(--muted);font-size:.95rem;margin:0 0 16px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.fb{margin-top:16px;padding:10px 14px;border-left:4px solid var(--line);background:var(--panel);border-radius:0 10px 10px 0}
.fb:empty{display:none}
.fb.ok{border-color:var(--ok)}
.fb.bad{border-color:var(--bad)}
.fb p{margin:.35em 0}
.fb .head{font-weight:700}
.fb.ok .head{color:var(--ok)}
.fb.bad .head{color:var(--bad)}

.foot{margin:28px 0 0;color:var(--muted);font-size:.95rem}
a{color:var(--accent)}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.cat-item{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.cat-item svg{display:block;width:100%;height:210px}
.cat-item svg.h{height:auto;margin:50px 0}
.cat-item figcaption{font-size:.9rem;margin-top:6px;line-height:1.35}
button:focus-visible,summary:focus-visible,svg:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Skaala lugemine</h1>
      <p class="sub">Harjuta mõõteriistade skaaladelt lugemist: mõõtepiirkond, jaotise väärtus, mõõtmistäpsus ja näit.</p>
    </div>
    <div class="score" aria-live="polite">Esimesel katsel õigesti: <b id="sc-first">0</b> / <span id="sc-total">0</span></div>
  </header>

  <div class="controls">
  <nav class="tabs" role="tablist" aria-label="Harjutuse liik">
    <button role="tab" data-mode="1" aria-selected="true">1. Skaala andmed</button>
    <button role="tab" data-mode="2" aria-selected="false">2. Näidu lugemine</button>
    <button role="tab" data-mode="3" aria-selected="false">3. Osuti seadmine</button>
  </nav>
  <div class="tabs levels" role="group" aria-label="Raskusaste">
    <span class="lvl-lab" aria-hidden="true">Raskusaste:</span>
    <button type="button" data-level="1" aria-pressed="true">Kerge</button>
    <button type="button" data-level="2" aria-pressed="false">Paras</button>
    <button type="button" data-level="3" aria-pressed="false">Raske</button>
  </div>
  </div>

  <details class="units">
    <summary>Ühikud harjutuses</summary>
    <div class="chips" id="chips"></div>
  </details>

  <main class="work">
    <section class="bench" aria-labelledby="inst-name">
      <h2 id="inst-name"></h2>
      <div id="stage"></div>
    </section>
    <section class="task" id="task" aria-live="off"></section>
  </main>
  <p class="foot"><a href="#kataloog">Vaata kõiki skaalasid</a></p>
</div>

<script src="skaalad.js"></script>
<script>
(function(){
'use strict';

/* ---------- abifunktsioonid ---------- */
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const R6 = x => Math.round(x*1e6)/1e6;
const f1 = n => n.toFixed(1);
const DEG = Math.PI/180;

function fmt(x){ return String(R6(x)).replace('.',',').replace('-','−'); }
function fmtSub(x){ return x<0 ? '('+fmt(x)+')' : fmt(x); }
function parseNum(s){
  if(s==null) return null;
  s = String(s).trim().replace(/\s+/g,'').replace(',','.').replace(/[−–]/g,'-');
  if(!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return null;
  return Number(s);
}
const same = (a,b,d) => a!==null && Math.abs(a-b) < d*1e-3 + 1e-9;
const val = (sc,i) => R6(sc.min + i*sc.d);
const tickCls = (sc,i) => i%sc.k===0 ? 'mj' : (sc.k%2===0 && i%(sc.k/2)===0 ? 'md' : 'mn');
const jw = m => m===1 ? 'jaotis' : 'jaotist';

/* ---------- skaalade kataloog (andmed failis skaalad.js) ---------- */
const TYPE_OF = {mm:'h', cm:'h', m:'h', km:'h', N:'spring', '°C':'thermo', s:'circle'}; // muud ühikud: ümar osutiga skaala
const UNIT_ORDER = ['mm','cm','m','km','N','°C','s','km/h','m/s','J','A','mA','V','mV','W','mW','kPa','kg'];
const MAXN = {h:80, thermo:72, spring:60, arc:80, circle:80};   // kriipse kõige rohkem
const LEVELS = {
  1:{name:'Kerge', major:0.15},  // major: kui tihti satub näit täpselt nummerdatud kriipsule
  2:{name:'Paras', major:0.05},
  3:{name:'Raske', major:0}
};

// kas skaala arvud mahuvad üksteist ja mõõteriista serva puudutamata ära
function labelsFit(sc){
  let w=0;
  for(let i=0;i<=sc.N;i+=sc.k) w=Math.max(w,fmt(val(sc,i)).length);
  const L=sc.N/sc.k, need=w*10+10;
  const room={h:552/L, arc:499/L, circle:666/L}[sc.type];
  if(room!==undefined) return w<=6 && room>=need;
  return w<=6 && 386/L>=24;
}

// j = mitmendast nummerdatud vahemikust aken algab
function makeScale(e,j){
  const [nimi,u,lo,hi,d,k,lv,win]=e, ls=R6(d*k), type=TYPE_OF[u]||'arc';
  const L = win ? win : Math.round((hi-lo)/ls), min=R6(lo+j*ls), N=L*k;
  return {min, max:R6(min+N*d), d, k, ls, N, unit:u, name:nimi, type, lo, hi, win:!!win};
}
function allWindows(e){
  const [, ,lo,hi,d,k,,win]=e;
  if(!win) return [makeScale(e,0)];
  const Ltot=Math.round((hi-lo)/(d*k)), out=[];
  for(let j=0;j<=Ltot-win;j++) out.push(makeScale(e,j));
  return out;
}

// kontrollib kataloogi rida; tagastab vea kirjelduse või tühja teksti
function checkEntry(e){
  if(!Array.isArray(e) || e.length<7) return 'rida on poolik (vaja vähemalt 7 veergu)';
  const [nimi,u,lo,hi,d,k,lv,win]=e, type=TYPE_OF[u]||'arc', errs=[];
  if(typeof nimi!=='string' || !nimi) errs.push('nimi puudub');
  if(typeof u!=='string' || !u) errs.push('ühik puudub');
  if(![lo,hi,d,k].every(Number.isFinite)) return 'algus, lõpp, jaotis või k ei ole arv';
  if(!(hi>lo)) errs.push('lõpp peab olema algusest suurem');
  if(!(d>0)) errs.push('jaotis peab olema positiivne');
  if(!Number.isInteger(k) || k<1) errs.push('k peab olema positiivne täisarv');
  if(![1,2,3].includes(lv)) errs.push('tase peab olema 1, 2 või 3');
  if(errs.length) return errs.join('; ');
  const ls=R6(d*k), Ntot=R6((hi-lo)/d), Ltot=R6((hi-lo)/ls);
  if(!Number.isInteger(Ntot)) errs.push('(lõpp − algus) ei jagu jaotisega');
  else if(!Number.isInteger(Ltot)) errs.push('skaala lõpus ei oleks arvu: (lõpp − algus) ei jagu arvuga jaotis · k');
  if(win){
    if(!Number.isInteger(win) || win<1) errs.push('aken peab olema positiivne täisarv');
    else if(win>=Ltot) errs.push('aken on sama pikk kui terve skaala, jäta aken ära');
    if(type!=='h' && type!=='thermo') errs.push('akent saab kasutada ainult joonlaua ja termomeetri puhul');
  }
  if(type==='circle' && lo!==0) errs.push('stopperi skaala peab algama nullist');
  if(errs.length) return errs.join('; ');
  for(const sc of allWindows(e)){
    if(sc.N>MAXN[type]) return `liiga palju kriipse (${sc.N}, lubatud kuni ${MAXN[type]})`+(type==='h'||type==='thermo'?'; kasuta väiksemat akent':'');
    if(!labelsFit(sc)) return 'skaala arvud ei mahu kõrvuti ära (liiga palju või liiga pikad arvud)';
  }
  return '';
}

const CATALOG=[], BAD=[];
(window.SKAALAD||[]).forEach((e,i)=>{
  const err=checkEntry(e);
  if(err) BAD.push({nr:i+1, e, err});
  else CATALOG.push({nr:i+1, e, u:e[1], lv:e[6], win:!!e[7]});
});
if(BAD.length) console.warn('Vigased read failis skaalad.js:', BAD);

/* ---------- skaalade joonistamine ---------- */
const T = {};

let clipN=0;
T.h = { cls:'h', vb:'0 30 640 150', x0:44, w:552, top:70,
  X(sc,v){ return this.x0 + (v-sc.min)/(sc.max-sc.min)*this.w; },
  stat(sc){
    const top=this.top, cid='rclip'+(++clipN);
    let s=`<rect x="14" y="${top}" width="612" height="100" rx="6" class="s-body"/>`+
          `<clipPath id="${cid}"><rect x="15" y="${top}" width="610" height="100"/></clipPath>`;
    // lõik algab ja lõpeb nummerdatud (pika) kriipsuga – kriipse lõigust väljapoole ei joonistata
    const from=0, to=sc.N;
    s+=`<g clip-path="url(#${cid})">`;
    for(let i=from;i<=to;i++){
      const x=f1(this.X(sc,val(sc,i))), c=tickCls(sc,i), len=c==='mj'?34:c==='md'?23:14;
      s+=`<line x1="${x}" y1="${top}" x2="${x}" y2="${top+len}" class="s-tick ${c}"/>`;
      if(c==='mj') s+=`<text x="${x}" y="${top+57}" text-anchor="middle" class="s-lbl">${fmt(val(sc,i))}</text>`;
    }
    s+=`</g><text x="612" y="${top+89}" text-anchor="end" class="s-unit">${sc.unit}</text>`;
    return s;
  },
  ptr(sc,v){
    const x=this.X(sc,v), top=this.top;
    return `<line x1="${f1(x)}" y1="${top-6}" x2="${f1(x)}" y2="${top+36}" class="s-ndl" stroke-width="2"/>`+
           `<polygon points="${f1(x)},${top-1} ${f1(x-12)},${top-28} ${f1(x+12)},${top-28}" class="s-ndl"/>`;
  },
  pick(sc,p){ return sc.min + (p.x-this.x0)/this.w*(sc.max-sc.min); },
  subj:'osuti'
};

T.thermo = { cls:'v', vb:'0 0 260 560', xT:100, yb:456, yt:60,
  Y(sc,v){ return this.yb - (v-sc.min)/(sc.max-sc.min)*(this.yb-this.yt); },
  stat(sc){
    const xT=this.xT;
    let s=`<rect x="40" y="14" width="180" height="530" rx="16" class="s-body"/>`+
          `<rect x="${xT-10}" y="32" width="20" height="474" rx="10" class="s-glass"/>`+
          `<circle cx="${xT}" cy="500" r="25" class="s-glass"/><circle cx="${xT}" cy="500" r="19" class="s-liq"/>`;
    for(let i=0;i<=sc.N;i++){
      const y=f1(this.Y(sc,val(sc,i))), c=tickCls(sc,i), len=c==='mj'?30:c==='md'?20:12;
      s+=`<line x1="${xT+14}" y1="${y}" x2="${xT+14+len}" y2="${y}" class="s-tick ${c}"/>`;
      if(c==='mj') s+=`<text x="${xT+52}" y="${f1(+y+6)}" class="s-lbl">${fmt(val(sc,i))}</text>`;
    }
    s+=`<text x="${xT+52}" y="38" class="s-unit">°C</text>`;
    return s;
  },
  ptr(sc,v){
    const y=this.Y(sc,v);
    return `<rect x="${this.xT-6}" y="${f1(y)}" width="12" height="${f1(500-y)}" class="s-liq"/>`;
  },
  pick(sc,p){ return sc.min + (this.yb-p.y)/(this.yb-this.yt)*(sc.max-sc.min); },
  subj:'vedelikusamba ots'
};

T.spring = { cls:'v', vb:'0 0 240 580', xs:140, yt:84, yb:470,
  Y(sc,v){ return this.yt + (v-sc.min)/(sc.max-sc.min)*(this.yb-this.yt); },
  stat(sc){
    const xs=this.xs;
    let s=`<circle cx="${xs}" cy="22" r="11" class="s-rod"/><line x1="${xs}" y1="33" x2="${xs}" y2="44" class="s-rod"/>`+
          `<rect x="20" y="44" width="180" height="466" rx="12" class="s-body"/>`+
          `<rect x="${xs-9}" y="62" width="18" height="430" rx="9" class="s-slot"/>`;
    for(let i=0;i<=sc.N;i++){
      const y=f1(this.Y(sc,val(sc,i))), c=tickCls(sc,i), len=c==='mj'?30:c==='md'?20:12;
      s+=`<line x1="${xs-16}" y1="${y}" x2="${xs-16-len}" y2="${y}" class="s-tick ${c}"/>`;
      if(c==='mj') s+=`<text x="${xs-54}" y="${f1(+y+6)}" text-anchor="end" class="s-lbl">${fmt(val(sc,i))}</text>`;
    }
    s+=`<text x="${xs+40}" y="${this.yb+18}" text-anchor="end" class="s-unit">N</text>`;
    return s;
  },
  ptr(sc,v){
    const xs=this.xs, y=this.Y(sc,v), y0=64, y1=y-5, n=14, seg=(y1-y0)/n;
    let d=`M${xs} ${y0}`;
    for(let j=1;j<=n;j++){ const x = j===n ? xs : xs + (j%2 ? 6 : -6); d+=` L${x} ${f1(y0+seg*j)}`; }
    return `<path d="${d}" class="s-spring"/>`+
      `<line x1="${xs}" y1="${f1(y)}" x2="${xs}" y2="540" class="s-rod"/>`+
      `<path d="M${xs} 540 v12 a11 11 0 1 1 -18 8" class="s-rod"/>`+
      `<rect x="${xs-13}" y="${f1(y-4)}" width="26" height="8" rx="2" class="s-ndl"/>`+
      `<polygon points="${xs-16},${f1(y)} ${xs-8},${f1(y-6)} ${xs-8},${f1(y+6)}" class="s-ndl"/>`;
  },
  pick(sc,p){ return sc.min + (p.y-this.yt)/(this.yb-this.yt)*(sc.max-sc.min); },
  subj:'osuti'
};

function dialP(cx,cy,a,r){ return [cx + r*Math.sin(a*DEG), cy - r*Math.cos(a*DEG)]; }
function needle(cx,cy,a,R){
  const [x,y]=dialP(cx,cy,a,R-16), [tx,ty]=dialP(cx,cy,a+180,24);
  return `<line x1="${f1(tx)}" y1="${f1(ty)}" x2="${f1(x)}" y2="${f1(y)}" class="s-ndl" stroke-width="4" stroke-linecap="round"/>`+
         `<circle cx="${cx}" cy="${cy}" r="11" class="s-hub"/><circle cx="${cx}" cy="${cy}" r="4" class="s-ndl"/>`;
}
function dialTicks(sc,cx,cy,R,angleOf,from,to){
  let s='';
  for(let i=from;i<=to;i++){
    const a=angleOf(val(sc,i)), c=tickCls(sc,i), len=c==='mj'?22:c==='md'?15:9;
    const [x1,y1]=dialP(cx,cy,a,R), [x2,y2]=dialP(cx,cy,a,R-len);
    s+=`<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" class="s-tick ${c}"/>`;
  }
  return s;
}
function dialLabel(cx,cy,a,R,text){
  const [x,y]=dialP(cx,cy,a,R-44);
  return `<text x="${f1(x)}" y="${f1(y)}" text-anchor="middle" dominant-baseline="central" class="s-lbl">${text}</text>`;
}

T.arc = { cls:'d', vb:'0 0 400 380', cx:200, cy:200, R:150, a0:-135, a1:135,
  A(sc,v){ return this.a0 + (v-sc.min)/(sc.max-sc.min)*(this.a1-this.a0); },
  stat(sc){
    const {cx,cy,R}=this;
    let s=`<circle cx="${cx}" cy="${cy}" r="172" class="s-body"/>`;
    s+=dialTicks(sc,cx,cy,R,v=>this.A(sc,v),0,sc.N);
    for(let i=0;i<=sc.N;i+=sc.k) s+=dialLabel(cx,cy,this.A(sc,val(sc,i)),R,fmt(val(sc,i)));
    s+=`<text x="${cx}" y="${cy+78}" text-anchor="middle" class="s-unit">${sc.unit}</text>`;
    return s;
  },
  ptr(sc,v){ return needle(this.cx,this.cy,this.A(sc,v),this.R); },
  pick(sc,p){
    let th=Math.atan2(p.x-this.cx, this.cy-p.y)/DEG;
    th=Math.max(this.a0,Math.min(this.a1,th));
    return sc.min + (th-this.a0)/(this.a1-this.a0)*(sc.max-sc.min);
  },
  subj:'osuti'
};

T.circle = { cls:'d', vb:'0 0 400 410', cx:200, cy:224, R:150,
  A(sc,v){ return (v-sc.min)/(sc.max-sc.min)*360; },
  stat(sc){
    const {cx,cy,R}=this;
    let s=`<rect x="186" y="10" width="28" height="20" rx="4" class="s-body"/><rect x="193" y="30" width="14" height="24" class="s-body"/>`+
          `<circle cx="${cx}" cy="${cy}" r="172" class="s-body"/>`;
    s+=dialTicks(sc,cx,cy,R,v=>this.A(sc,v),0,sc.N-1);
    for(let i=sc.k;i<=sc.N;i+=sc.k) s+=dialLabel(cx,cy,this.A(sc,val(sc,i)),R,fmt(val(sc,i)));
    s+=`<text x="${cx}" y="${cy+78}" text-anchor="middle" class="s-unit">s</text>`;
    return s;
  },
  ptr(sc,v){ return needle(this.cx,this.cy,this.A(sc,v),this.R); },
  pick(sc,p){
    const th=(Math.atan2(p.x-this.cx, this.cy-p.y)/DEG + 360) % 360;
    return sc.min + th/360*(sc.max-sc.min);
  },
  subj:'osuti'
};

function idxFromValue(sc,v){
  let i=Math.round((v-sc.min)/sc.d);
  if(sc.type==='circle') i=((i%sc.N)+sc.N)%sc.N;
  return Math.max(0,Math.min(sc.N,i));
}

/* ---------- olek ---------- */
function loadLevel(){ try{ const v=+localStorage.getItem('skaala-level'); return LEVELS[v]?v:1; }catch(e){ return 1; } }
function loadAcc(){ try{ return localStorage.getItem('skaala-tapsus')!=='0'; }catch(e){ return true; } }
const state = { mode:1, level:loadLevel(), withAcc:loadAcc(), enabled:new Set(CATALOG.map(c=>c.u)), sc:null, idx:0, target:0, cur:0, attempted:false, lastU:null, lastNr:null, note:'' };
const score = { total:0, first:0 };

function chooseIdx(sc){
  const pMajor=LEVELS[state.level].major;
  for(let t=0;t<60;t++){ const i=rnd(1,sc.N-1); if(i%sc.k!==0 || Math.random()<pMajor) return i; }
  return 1;
}

function newTask(){
  // harjutuses „Skaala andmed“ on vaja tervet skaalat, mitte lõiku
  const fits = c => state.mode!==1 || !c.win;
  let pool=CATALOG.filter(c=>fits(c) && state.enabled.has(c.u) && c.lv===state.level);
  state.note='';
  if(!pool.length){
    pool=CATALOG.filter(c=>fits(c) && state.enabled.has(c.u));
    state.note='Valitud ühikutega sellel raskusastmel siin harjutuses skaalasid pole, seepärast on see skaala teiselt raskusastmelt.';
  }
  if(!pool.length){
    pool=CATALOG.filter(fits);
    state.note='Valitud ühikutega selles harjutuses skaalasid pole, seepärast on see skaala teise ühikuga.';
  }
  // kõigepealt ühik, siis rida – nii tulevad kõik ühikud võrdselt sageli
  const units=[...new Set(pool.map(c=>c.u))];
  let u=pick(units);
  if(units.length>1){ let g=0; while(u===state.lastU && g++<20) u=pick(units); }
  const rows=pool.filter(c=>c.u===u);
  let c=pick(rows);
  if(rows.length>1){ let g=0; while(c.nr===state.lastNr && g++<20) c=pick(rows); }
  state.lastU=u; state.lastNr=c.nr;
  state.sc=pick(allWindows(c.e));
  state.attempted=false;
  if(state.mode===2) state.idx=chooseIdx(state.sc);
  if(state.mode===3){ state.target=chooseIdx(state.sc); state.cur=0; }
  renderInstrument();
  renderPanel();
}

/* ---------- mõõteriista kuvamine ---------- */
function renderInstrument(){
  const sc=state.sc, t=T[sc.type];
  let v=null;
  if(state.mode===1) v = sc.type==='h' ? null : sc.min;
  if(state.mode===2) v = val(sc,state.idx);
  if(state.mode===3) v = val(sc,state.cur);
  const live = state.mode===3;
  $('#inst-name').textContent = sc.name;
  const a11y = live
    ? `role="slider" tabindex="0" aria-label="${sc.name}: ${t.subj}" aria-valuemin="${sc.min}" aria-valuemax="${sc.max}" aria-valuenow="${v}" aria-valuetext="${fmt(v)} ${sc.unit}"`
    : `role="img" aria-label="${sc.name}, ühik ${sc.unit}"`;
  $('#stage').innerHTML =
    `<svg id="inst" class="${t.cls}${live?' live':''}" viewBox="${t.vb}" xmlns="http://www.w3.org/2000/svg" ${a11y}>`+
    `<g>${t.stat(sc)}</g><g id="ptr">${v===null?'':t.ptr(sc,v)}</g></svg>`;
  if(live) bindDrag($('#inst'));
}

function setCur(i){
  const sc=state.sc, t=T[sc.type];
  if(i===state.cur) return;
  state.cur=i;
  const v=val(sc,i);
  $('#ptr').innerHTML=t.ptr(sc,v);
  const svg=$('#inst');
  svg.setAttribute('aria-valuenow',v);
  svg.setAttribute('aria-valuetext',fmt(v)+' '+sc.unit);
  const fb=$('#fb'); if(fb && fb.classList.contains('bad')){ fb.innerHTML=''; fb.className='fb'; }
}

function bindDrag(svg){
  let drag=false;
  const move=e=>{
    const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
    const p=pt.matrixTransform(svg.getScreenCTM().inverse());
    setCur(idxFromValue(state.sc, T[state.sc.type].pick(state.sc,p)));
  };
  svg.addEventListener('pointerdown',e=>{ drag=true; svg.setPointerCapture(e.pointerId); move(e); e.preventDefault(); svg.focus({preventScroll:true}); });
  svg.addEventListener('pointermove',e=>{ if(drag) move(e); });
  svg.addEventListener('pointerup',()=>{ drag=false; });
  svg.addEventListener('pointercancel',()=>{ drag=false; });
  svg.addEventListener('keydown',e=>{
    const sc=state.sc, circ=sc.type==='circle', top=circ?sc.N-1:sc.N;
    let i=state.cur;
    const step={ArrowUp:1,ArrowRight:1,ArrowDown:-1,ArrowLeft:-1,PageUp:sc.k,PageDown:-sc.k}[e.key];
    if(step!==undefined){
      // dünamomeetril kasvab skaala allapoole, nii et nool alla suurendab näitu
      const s = (sc.type==='spring' && (e.key==='ArrowUp'||e.key==='ArrowDown')) ? -step : step;
      i = circ ? ((i+s)%sc.N+sc.N)%sc.N : Math.max(0,Math.min(top,i+s));
    } else if(e.key==='Home') i=0;
    else if(e.key==='End') i=top;
    else if(e.key==='Enter'){ check(); e.preventDefault(); return; }
    else return;
    e.preventDefault(); setCur(i);
  });
}

/* ---------- ülesande paneel ---------- */
function field(id,label){ return `<input id="${id}" inputmode="decimal" autocomplete="off" aria-label="${label}"><span class="mark" id="${id}-m" aria-hidden="true"></span>`; }

function renderPanel(){
  const sc=state.sc, u=sc.unit;
  let h='';
  if(state.mode===1){
    h=`<p class="prompt">Vaata skaalat ja leia selle andmed.</p>
      <div class="row"><span class="lab">Mõõtepiirkond</span><div class="inline">${field('f-lo','Mõõtepiirkonna algus')}<span>…</span>${field('f-hi','Mõõtepiirkonna lõpp')}<span class="u">${u}</span></div></div>
      <div class="row"><span class="lab">Jaotise väärtus</span><div class="inline">${field('f-d','Jaotise väärtus')}<span class="u">${u}</span></div></div>
      <div class="row"><span class="lab">Mõõtmistäpsus</span><div class="inline"><span>±</span>${field('f-a','Mõõtmistäpsus')}<span class="u">${u}</span></div></div>`;
  } else if(state.mode===2){
    const what = sc.type==='thermo' ? 'termomeetri näit' : 'mõõteriista näit';
    const acc=state.withAcc;
    h=`<label class="opt"><input type="checkbox" id="f-acc"${acc?' checked':''}> Koos mõõtmistäpsusega</label>
      <p class="prompt">Loe ${what}${acc?' koos mõõtmistäpsusega':''}.</p>
      <div class="row"><span class="lab">Mõõtmistulemus</span><div class="inline">${field('f-v','Näit')}${acc?`<span>±</span>${field('f-a','Mõõtmistäpsus')}`:''}<span class="u">${u}</span></div></div>`;
  } else {
    const verb = sc.type==='thermo' ? 'Lohista vedelikusammast nii, et termomeeter näitaks' : 'Sea osuti nii, et mõõteriist näitaks';
    h=`<p class="prompt">${verb}<span class="target">${fmt(val(sc,state.target))} ${u}</span></p>
      <p class="hint">Lohista hiire või sõrmega. Klaviatuuril liigutavad nooleklahvid ühe jaotise kaupa.</p>`;
  }
  if(state.note) h=`<p class="hint">${state.note}</p>`+h;
  h+=`<div class="btns"><button class="btn primary" id="b-check">Kontrolli</button><button class="btn" id="b-sol">Näita lahendust</button><button class="btn" id="b-new">Uus ülesanne</button></div>
      <div class="fb" id="fb" aria-live="polite"></div>`;
  $('#task').innerHTML=h;
  $('#b-check').onclick=check;
  $('#b-sol').onclick=showSolution;
  $('#b-new').onclick=newTask;
  const accBox=$('#f-acc');
  if(accBox) accBox.addEventListener('change',()=>{
    state.withAcc=accBox.checked;
    try{ localStorage.setItem('skaala-tapsus',state.withAcc?'1':'0'); }catch(e){}
    const v=$('#f-v').value;           // sama ülesanne jääb, sisestatud näit säilib
    renderPanel(); $('#f-v').value=v; $('#f-acc').focus();
  });
  document.querySelectorAll('#task input[inputmode]').forEach(inp=>{
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } });
    inp.addEventListener('input',()=>{ inp.classList.remove('ok','bad'); const m=$('#'+inp.id+'-m'); if(m){ m.textContent=''; m.className='mark'; } });
  });
}

function mark(id,ok){
  const inp=$('#'+id), m=$('#'+id+'-m');
  inp.classList.remove('ok','bad'); inp.classList.add(ok?'ok':'bad');
  m.className='mark '+(ok?'ok':'bad'); m.textContent=ok?'✓':'✗';
}
function num(id){ return parseNum($('#'+id).value); }

function feedback(ok,head,body){
  const fb=$('#fb');
  fb.className='fb '+(ok?'ok':'bad');
  fb.innerHTML=`<p class="head">${head}</p>${body||''}`;
}

function count(ok){
  if(state.attempted) return;
  state.attempted=true; score.total++; if(ok) score.first++;
  $('#sc-first').textContent=score.first; $('#sc-total').textContent=score.total;
}

/* ---------- selgitused ---------- */
function locate(sc,i){ const b=Math.floor(i/sc.k)*sc.k; return {b, m:i-b, a:val(sc,b)}; }
function baseName(sc,b){ return (sc.type==='circle' && b===0) ? '0 (skaala algus ülal)' : fmt(val(sc,b)); }

function expScale(sc){
  const u=sc.unit, j=sc.N>=2*sc.k?1:0, a=R6(sc.min+j*sc.ls), b=R6(a+sc.ls);
  let h = sc.type==='circle'
    ? `<p>Stopperi skaala algab nullist (ülal) ja ring lõpeb arvu ${fmt(sc.max)} juures, seega mõõtepiirkond on 0 … ${fmt(sc.max)} s.</p>`
    : `<p>Mõõtepiirkond ulatub skaala väikseimast väärtusest suurimani: ${fmt(sc.min)} … ${fmt(sc.max)} ${u}.</p>`;
  h+=`<p>Jaotise väärtuse leidmiseks vali kaks kõrvuti asuvat arvu, näiteks ${fmt(a)} ja ${fmt(b)}. Nende vahe on ${fmt(b)} − ${fmtSub(a)} = ${fmt(sc.ls)} ${u}. Nende arvude vahel on ${sc.k} jaotist, seega jaotise väärtus on ${fmt(sc.ls)} : ${sc.k} = ${fmt(sc.d)} ${u}.</p>`;
  h+=`<p>Mõõtmistäpsus on pool jaotise väärtusest: ${fmt(sc.d)} : 2 = ${fmt(sc.d/2)} ${u}.</p>`;
  return h;
}
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function expRead(sc,i,acc){
  const u=sc.unit, {b,m,a}=locate(sc,i), v=val(sc,i), subj=cap(T[sc.type].subj);
  let h=`<p>Jaotise väärtus on ${fmt(sc.d)} ${u}.</p>`;
  h+= m===0
    ? `<p>${subj} on täpselt arvu ${baseName(sc,b)} kohal.</p>`
    : `<p>${subj} on ${m} ${jw(m)} pärast arvu ${baseName(sc,b)}, seega näit on ${fmt(a)} + ${m} · ${fmt(sc.d)} = ${fmt(v)} ${u}.</p>`;
  h+= acc
    ? `<p>Mõõtmistäpsus on pool jaotise väärtusest, ± ${fmt(sc.d/2)} ${u}. Mõõtmistulemus: ${fmt(v)} ± ${fmt(sc.d/2)} ${u}.</p>`
    : `<p>Mõõtmistulemus: ${fmt(v)} ${u}.</p>`;
  return h;
}
function expSet(sc,i){
  const u=sc.unit, {b,m,a}=locate(sc,i), v=val(sc,i), subj=T[sc.type].subj;
  if(m===0) return `<p>Arv ${fmt(v)} on skaalal kirjas, seega peab ${subj} olema täpselt selle arvu kohal.</p>`;
  return `<p>Jaotise väärtus on ${fmt(sc.d)} ${u}. Lähim väiksem arv skaalal on ${baseName(sc,b)}. ${fmt(v)} − ${fmtSub(a)} = ${fmt(m*sc.d)} ${u}, mis teeb ${fmt(m*sc.d)} : ${fmt(sc.d)} = ${m} ${jw(m)}.</p>`+
         `<p>Seega peab ${subj} olema ${m} ${jw(m)} pärast arvu ${baseName(sc,b)}.</p>`;
}

/* ---------- kontroll ja lahendus ---------- */
const HALF = '<p>Meeldetuletus: mõõtmistäpsus on pool jaotise väärtusest.</p>';
const DIV  = '<p>Jaotise väärtus = kahe kõrvuti asuva arvu vahe : jaotiste arv nende vahel.</p>';

function check(){
  const sc=state.sc, d=sc.d;
  if(state.mode===1){
    const okLo=same(num('f-lo'),sc.min,d), okHi=same(num('f-hi'),sc.max,d),
          okD=same(num('f-d'),d,d), okA=same(num('f-a'),d/2,d);
    mark('f-lo',okLo); mark('f-hi',okHi); mark('f-d',okD); mark('f-a',okA);
    const all=okLo&&okHi&&okD&&okA; count(all);
    if(all) feedback(true,'Õige!',expScale(sc));
    else feedback(false,'Punasega märgitud vastused on valed. Proovi uuesti või vaata lahendust.',
      (!okD?DIV:'')+(okD&&!okA?HALF:''));
  } else if(state.mode===2){
    const acc=state.withAcc, v=val(sc,state.idx), okV=same(num('f-v'),v,d), okA=!acc || same(num('f-a'),d/2,d);
    mark('f-v',okV); if(acc) mark('f-a',okA);
    const all=okV&&okA; count(all);
    if(all) feedback(true,'Õige!',expRead(sc,state.idx,acc));
    else feedback(false,acc?'Punasega märgitud vastused on valed. Proovi uuesti või vaata lahendust.':'Vastus on vale. Proovi uuesti või vaata lahendust.',
      (!okV?'<p>Leia esmalt jaotise väärtus, siis loe, mitu jaotist on näit viimasest arvust edasi.</p>':'')+(!okA?HALF:''));
  } else {
    const ok=state.cur===state.target; count(ok);
    if(ok) feedback(true,'Õige!',expSet(sc,state.target));
    else feedback(false,'Veel mitte.',`<p>Praegu näitab mõõteriist ${fmt(val(sc,state.cur))} ${sc.unit}. Proovi uuesti või vaata lahendust.</p>`);
  }
}

function showSolution(){
  const sc=state.sc;
  count(false);
  if(state.mode===1){
    $('#f-lo').value=fmt(sc.min); $('#f-hi').value=fmt(sc.max); $('#f-d').value=fmt(sc.d); $('#f-a').value=fmt(sc.d/2);
    ['f-lo','f-hi','f-d','f-a'].forEach(id=>mark(id,true));
    feedback(true,'Lahendus',expScale(sc));
  } else if(state.mode===2){
    $('#f-v').value=fmt(val(sc,state.idx)); mark('f-v',true);
    if(state.withAcc){ $('#f-a').value=fmt(sc.d/2); mark('f-a',true); }
    feedback(true,'Lahendus',expRead(sc,state.idx,state.withAcc));
  } else {
    setCur(state.target);
    feedback(true,'Lahendus',expSet(sc,state.target));
  }
}

/* ---------- vahelehed ja ühikud ---------- */
document.querySelectorAll('.tabs button[role="tab"]').forEach(b=>{
  b.addEventListener('click',()=>{
    state.mode=+b.dataset.mode;
    document.querySelectorAll('.tabs button[role="tab"]').forEach(x=>x.setAttribute('aria-selected',x===b?'true':'false'));
    newTask();
  });
});

const lvlBtns=document.querySelectorAll('.levels button');
function showLevel(){ lvlBtns.forEach(x=>x.setAttribute('aria-pressed',+x.dataset.level===state.level?'true':'false')); }
lvlBtns.forEach(b=>{
  b.addEventListener('click',()=>{
    state.level=+b.dataset.level;
    try{ localStorage.setItem('skaala-level',String(state.level)); }catch(e){}
    showLevel();
    newTask();
  });
});
showLevel();

const chips=$('#chips');
const unitList=[...state.enabled].sort((a,b)=>{
  const ia=UNIT_ORDER.indexOf(a), ib=UNIT_ORDER.indexOf(b);
  return (ia<0?99:ia)-(ib<0?99:ib);
});
unitList.forEach(unit=>{
  const c=document.createElement('button');
  c.className='chip'; c.type='button'; c.textContent=unit; c.setAttribute('aria-pressed','true');
  c.addEventListener('click',()=>{
    const on=state.enabled.has(unit);
    if(on && state.enabled.size===1) return; // vähemalt üks ühik peab jääma
    on ? state.enabled.delete(unit) : state.enabled.add(unit);
    c.setAttribute('aria-pressed',on?'false':'true');
    newTask();
  });
  chips.appendChild(c);
});

/* ---------- kataloogi ülevaade (index.html#kataloog) ---------- */
const esc = x => String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function renderCatalog(){
  let h=`<header><div><h1>Skaalade kataloog</h1>
    <p class="sub">Kõik failis <code>skaalad.js</code> kirjeldatud skaalad (${CATALOG.length}). Kui skaalast näidatakse ainult lõiku (aken), on pildil üks juhuslik lõik. <a href="#">Tagasi harjutama</a></p></div></header>`;
  if(BAD.length) h+=`<div class="fb bad"><p class="head">Vigased read – rakendus neid ei kasuta</p>`+
    BAD.map(b=>`<p>Nr ${b.nr}: <code>${esc(JSON.stringify(b.e))}</code> – ${esc(b.err)}</p>`).join('')+`</div>`;
  h+=`<div class="cat">`;
  CATALOG.forEach(c=>{
    const [nimi,u,lo,hi,d,k,lv,win]=c.e, sc=pick(allWindows(c.e)), t=T[sc.type];
    h+=`<figure class="cat-item"><svg class="${t.cls}" viewBox="${t.vb}" role="img" aria-label="${esc(nimi)}">${t.stat(sc)}${sc.type==='h'?'':t.ptr(sc,sc.min)}</svg>`+
       `<figcaption><b>Nr ${c.nr}. ${esc(nimi)}</b><br>${fmt(lo)} … ${fmt(hi)} ${esc(u)} · jaotis ${fmt(d)} ${esc(u)} · ${LEVELS[lv].name}${win?` · aken ${win}`:''}</figcaption></figure>`;
  });
  h+=`</div>`;
  document.querySelector('.wrap').innerHTML=h;
}
window.addEventListener('hashchange',()=>location.reload());

if(location.hash==='#kataloog') renderCatalog();
else if(!CATALOG.length) $('#task').innerHTML='<p class="prompt">Skaalade kataloog (skaalad.js) on tühi või puudub.</p>';
else newTask();
})();
</script>
